    <script>
      // --- ESTADO GLOBAL ---
      let carrito = JSON.parse(localStorage.getItem("carrito_pueblo")) || [];
      let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
      let categoriaActual = localStorage.getItem("categoria_actual") || "TODOS";

      // --- UTILIDADES ---
      function normalizar(texto) {
        return texto
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      }

      function precioARS(n) {
        return typeof n === "number" ? n.toLocaleString("es-AR") : n;
      }

      // --- GESTIÓN DE PRODUCTOS ---
      function mostrarProductos(lista) {
        const cont = document.getElementById("contenedor-productos");
        if (!cont) return;

        if (lista.length === 0) {
          cont.innerHTML = `<p class="col-span-full text-center py-20 text-gray-400 font-bold">No hay productos disponibles.</p>`;
          return;
        }

        cont.innerHTML = lista
          .map((p) => {
            const hayStock = p.stock !== false;
            const esFav = favoritos.includes(p.id);
            const yaEsta = carrito.find((item) => item.id === p.id);
            const cantidadAMostrar = yaEsta ? yaEsta.cantidad : 1;
            const fotoRuta = p.foto || `fotos/${p.id}.webp`;

            let precioHtml = "";
            if (p.precioConsultar) {
              precioHtml = `<p class="text-sm font-bold text-emerald-600 italic h-[40px] flex items-center"></p>`;
            } else if (p.oferta && p.precioAnterior > 0) {
              precioHtml = `<div class="flex flex-col h-[40px] justify-center"><span class="text-[10px] text-gray-400 line-through leading-none">$${precioARS(p.precioAnterior)}</span><div class="flex items-center gap-2"><span class="text-base md:text-xl font-black text-red-600">$${precioARS(p.precio)}</span><span class="oferta-titilando">OFERTA!</span></div></div>`;
            } else {
              precioHtml = `<p class="text-base md:text-xl font-black text-pueblo h-[40px] flex items-center">$${precioARS(p.precio)}</p>`;
            }

            let botonesHtml = "";
            if (!hayStock) {
              botonesHtml = `<button disabled class="w-full mt-2 bg-gray-200 text-gray-400 py-2.5 rounded-xl font-bold text-[10px] uppercase h-[100px]">Agotado</button>`;
            } else if (p.precioConsultar) {
              const infoExtra = p.nombre.includes("(")
                ? p.nombre.split("(")[1].replace(")", "")
                : "Modelos disponibles";
              botonesHtml = `<div class="flex items-center justify-center mt-2 bg-gray-50 rounded-lg border h-[46px] text-[10px] text-gray-500 font-medium px-2 text-center leading-tight">${infoExtra}</div><a href="https://wa.me/5493413261010?text=Hola! Me interesa: ${p.nombre} (Ref: ${p.id})" target="_blank" class="w-full mt-2 bg-pueblo text-white py-2.5 rounded-xl font-bold text-[10px] text-center uppercase block shadow-sm hover:bg-emerald-800 transition-colors">Consultar Precio</a>`;
            } else {
              const btnTexto = yaEsta ? "AGREGADO ✓" : "AGREGAR";
              const btnClase = yaEsta ? "btn-ya-agregado" : "bg-pueblo";
              botonesHtml = `<div class="flex items-center justify-between mt-2 bg-gray-50 rounded-lg p-1 border h-[46px]"><button onclick="cambiarCantCarta('${p.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white rounded shadow-sm text-pueblo font-bold">-</button><span id="cant-${p.id}" class="font-bold text-xs">${cantidadAMostrar}</span><button onclick="cambiarCantCarta('${p.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white rounded shadow-sm text-pueblo font-bold">+</button></div><button id="btn-add-${p.id}" onclick="prepararAlta('${p.id}', this)" class="w-full mt-2 ${btnClase} text-white py-2.5 rounded-xl font-bold text-[10px] uppercase transition-all duration-300 shadow-sm">${btnTexto}</button>`;
            }

            return `<div class="bg-white p-2 md:p-4 rounded-2xl border shadow-sm flex flex-col relative ${!hayStock ? "opacity-60" : ""}"><button onclick="toggleFavorito('${p.id}')" class="absolute top-3 left-3 z-10 bg-white/80 p-1.5 rounded-full shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${esFav ? "fill-red-500 text-red-500" : "text-gray-400"}" viewBox="0 0 20 20" fill="currentColor"><path d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" /></svg></button><div class="w-full aspect-square bg-white rounded-xl mb-2 flex items-center justify-center overflow-hidden relative"><img src="${fotoRuta}" loading="lazy" onclick="ampliar('${p.id}')" onerror="this.src='logo.webp'" class="w-full h-full object-contain cursor-zoom-in">${!hayStock ? `<div class="absolute inset-0 flex items-center justify-center bg-white/40"><span class="bg-black text-white px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-widest">Agotado</span></div>` : ""}</div><p class="text-[9px] font-mono text-gray-400 uppercase">${p.id}</p><h3 class="font-bold text-gray-800 text-xs md:text-sm min-h-[32px] leading-tight mb-1 line-clamp-2">${p.nombre}</h3>${precioHtml}${botonesHtml}</div>`;
          })
          .join("");
      }

      // --- FILTROS Y BÚSQUEDA ---
      function aplicarFiltros() {
        const txtBuscado = normalizar(
          document.getElementById("buscador").value,
        );
        let f =
          typeof productos !== "undefined"
            ? JSON.parse(JSON.stringify(productos))
            : [];

        if (txtBuscado) {
          f = f.filter(
            (p) =>
              normalizar(p.nombre).includes(txtBuscado) ||
              normalizar(p.id).includes(txtBuscado),
          );
        } else {
          if (categoriaActual === "FAVORITOS")
            f = f.filter((p) => favoritos.includes(p.id));
          else if (categoriaActual === "SALE")
            f = f.filter((p) => p.oferta === true);
          else if (categoriaActual !== "TODOS")
            f = f.filter((p) => p.cat === categoriaActual);
        }

        const orden = document.getElementById("ordenar").value;
        if (orden === "menor") f.sort((a, b) => a.precio - b.precio);
        if (orden === "mayor") f.sort((a, b) => b.precio - a.precio);

        mostrarProductos(f);
      }

      function filtrar(cat, btn) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        categoriaActual = cat;
        localStorage.setItem("categoria_actual", cat);

        document
          .querySelectorAll("#lista-categorias .categoria-btn")
          .forEach((b) => {
            b.classList.remove(
              "bg-pueblo",
              "text-white",
              "ring-2",
              "ring-red-400",
            );
            if (b.innerText.includes("SALE"))
              b.classList.add("bg-red-600", "text-white");
            else b.classList.add("bg-white", "text-gray-700");
          });

        if (btn) {
          if (cat === "SALE") btn.classList.add("ring-2", "ring-red-400");
          else {
            btn.classList.remove("bg-white", "text-gray-700");
            btn.classList.add("bg-pueblo", "text-white");
          }
        }
        aplicarFiltros();
      }

      // --- CARRITO ---
      function prepararAlta(id, btn) {
        if (btn.innerText.includes("✓")) {
          if (window.innerWidth < 768) toggleCarritoMovil();
          return;
        }
        btn.innerHTML = `<span>Cargando...</span>`;
        setTimeout(() => {
          const cantEl = document.getElementById(`cant-${id}`);
          if (cantEl) {
            agregarAlCarrito(id, parseInt(cantEl.innerText));
            btn.classList.add("animar-pop");
            setTimeout(() => btn.classList.remove("animar-pop"), 300);
          }
        }, 200);
      }

      function agregarAlCarrito(id, cantidad) {
        const prod = productos.find((p) => p.id === id);
        if (!prod) return;
        const existe = carrito.find((i) => i.id === id);
        if (existe) existe.cantidad = cantidad;
        else carrito.push({ ...prod, cantidad });
        if ("vibrate" in navigator) navigator.vibrate([50, 30, 50]);
        actualizarCarrito();
      }

      function actualizarCarrito() {
        const listaPC = document.getElementById("items-carrito");
        const listaMovil = document.getElementById("items-carrito-movil");
        let html = "";
        let total = 0;
        let cantTotal = 0;

        document.querySelectorAll("[id^='btn-add-']").forEach((b) => {
          b.innerText = "AGREGAR";
          b.classList.remove("btn-ya-agregado");
          b.classList.add("bg-pueblo");
        });

        carrito.forEach((item) => {
          total += item.precio * item.cantidad;
          cantTotal += item.cantidad;
          const btn = document.getElementById(`btn-add-${item.id}`);
          if (btn) {
            btn.innerText = "AGREGADO ✓";
            btn.classList.remove("bg-pueblo");
            btn.classList.add("btn-ya-agregado");
          }
          html += `<div class="flex justify-between items-center border-b py-3 text-xs"><div class="flex-1 font-bold pr-2 text-gray-700">${item.nombre}</div><div class="flex items-center gap-2 bg-gray-100 rounded-lg px-2 py-1"><button onclick="modificarEnCarrito('${item.id}', -1)" class="btn-cantidad font-black text-pueblo">-</button><span class="font-bold w-4 text-center">${item.cantidad}</span><button onclick="modificarEnCarrito('${item.id}', 1)" class="btn-cantidad font-black text-pueblo">+</button></div><button onclick="eliminar('${item.id}')" class="btn-eliminar text-red-500 font-bold ml-4 hover:scale-110 transition-transform">✕</button></div>`;
        });

        const emptyMsg =
          '<p class="text-center text-gray-400 py-4 italic">Carrito Vacío</p>';
        if (listaPC) listaPC.innerHTML = carrito.length === 0 ? emptyMsg : html;
        if (listaMovil)
          listaMovil.innerHTML = carrito.length === 0 ? emptyMsg : html;

        const totalStr = "$" + precioARS(total);
        document.getElementById("total-pedido").innerText = totalStr;
        document.getElementById("total-pedido-movil").innerText = totalStr;
        document.getElementById("total-flotante").innerText = totalStr;
        document.getElementById("cantidad-flotante").innerText = cantTotal;

        document
          .getElementById("btn-flotante-container")
          .classList.toggle("hidden", carrito.length === 0);
        localStorage.setItem("carrito_pueblo", JSON.stringify(carrito));
      }

      // --- WHATSAPP - FUNCIÓN ÚNICA ---
      function enviarWhatsApp() {
        if (carrito.length === 0) {
          alert("El carrito está vacío");
          return;
        }

        let m = "*NUEVO PEDIDO - TIENDA PUEBLO*\n";
        m += `Fecha: ${new Date().toLocaleDateString("es-AR")}\n`;
        m += "─────────────────\n\n";

        let t = 0;

        carrito.forEach((i) => {
          const subtotal = i.precio * i.cantidad;
          if (i.precioConsultar) {
            m += `*${i.cantidad}* x [${i.id}] ${i.nombre} (A CONSULTAR)\n`;
          } else {
            m += `*${i.cantidad}* x [${i.id}] ${i.nombre} ($${precioARS(i.precio)}) = *$${precioARS(subtotal)}*\n`;
          }
          t += subtotal;
        });

        m += `\n─────────────────\n`;
        m += `*TOTAL A PAGAR: $${precioARS(t)}*\n\n`;
        m += `Nota: Los precios y stock están sujetos a confirmación.`;

        // ✅ SIN ESPACIOS en la URL
        const url = `https://wa.me/543413261010?text=${encodeURIComponent(m)}`;
        window.open(url, "_blank");

        // Cerrar modal móvil si está abierto
        const modalMovil = document.getElementById("modal-carrito");
        if (modalMovil && !modalMovil.classList.contains("hidden")) {
          toggleCarritoMovil();
        }
      }

      // --- INTERFAZ ---
      function buscar() {
        aplicarFiltros();
      }
      function toggleFavorito(id) {
        if (favoritos.includes(id))
          favoritos = favoritos.filter((f) => f !== id);
        else favoritos.push(id);
        localStorage.setItem("favoritos", JSON.stringify(favoritos));
        aplicarFiltros();
      }
      function cambiarCantCarta(id, c) {
        const el = document.getElementById(`cant-${id}`);
        if (!el) return;
        let a = parseInt(el.innerText);
        if (a + c >= 1) {
          el.innerText = a + c;
          const existe = carrito.find((i) => i.id === id);
          if (existe) {
            existe.cantidad = a + c;
            actualizarCarrito();
          }
        }
      }
      function toggleCarritoMovil() {
        const modal = document.getElementById("modal-carrito");
        modal.classList.toggle("hidden");
        modal.classList.toggle("flex");
      }

      function ampliar(id) {
        const prod = productos.find((p) => p.id === id);
        if (!prod) return;
        document.getElementById("foto-ampliada").src =
          prod.foto || `fotos/${prod.id}.webp`;
        document.getElementById("desc-titulo").innerText = prod.nombre;
        const descTexto = document.getElementById("desc-texto");
        const separador = document.getElementById("separador-modal");
        if (prod.descripcion && prod.descripcion.trim() !== "") {
          descTexto.innerText = prod.descripcion;
          descTexto.classList.remove("hidden");
          if (separador) separador.classList.remove("hidden");
        } else {
          descTexto.classList.add("hidden");
          if (separador) separador.classList.add("hidden");
        }
        document
          .getElementById("modal-foto")
          .classList.replace("hidden", "flex");
        document.body.style.overflow = "hidden";
      }

      function cerrarModalFoto() {
        document
          .getElementById("modal-foto")
          .classList.replace("flex", "hidden");
        document.body.style.overflow = "auto";
      }
      function volverArriba() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function eliminar(id) {
        carrito = carrito.filter((i) => i.id !== id);
        const cantTxt = document.getElementById(`cant-${id}`);
        if (cantTxt) cantTxt.innerText = "1";
        actualizarCarrito();
      }
      function modificarEnCarrito(id, c) {
        const item = carrito.find((i) => i.id === id);
        if (item) {
          item.cantidad += c;
          if (item.cantidad <= 0) eliminar(id);
          else {
            const el = document.getElementById(`cant-${id}`);
            if (el) el.innerText = item.cantidad;
            actualizarCarrito();
          }
        }
      }

      // --- EVENTOS ---
      window.addEventListener("scroll", function () {
        const btn = document.getElementById("btn-subir");
        if (btn) {
          if (
            document.documentElement.scrollTop > 300 ||
            document.body.scrollTop > 300
          ) {
            btn.classList.remove("opacity-0", "pointer-events-none");
          } else {
            btn.classList.add("opacity-0", "pointer-events-none");
          }
        }
      });

      setTimeout(() => {
        actualizarCarrito();
        aplicarFiltros();
      }, 500);

      // Ocultar loading
      window.addEventListener("load", function () {
        setTimeout(() => {
          const overlay = document.getElementById("loading-overlay");
          if (overlay) {
            overlay.style.opacity = "0";
            setTimeout(() => {
              overlay.style.display = "none";
            }, 500);
          }
        }, 800);
      });
    </script>
  </body>
</html>
