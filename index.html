<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayorista Pueblo - Pedidos</title>
    <link rel="icon" href="Logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a5d37" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-mayorista {
        background: #1a5d37;
      }
      .text-mayorista {
        color: #1a5d37;
      }
      .border-mayorista {
        border-color: #1a5d37;
      }
      .icon-social {
        transition: transform 0.2s;
      }
      .icon-social:hover {
        transform: scale(1.15);
      }
      #items-carrito-movil::-webkit-scrollbar {
        width: 4px;
      }
      #items-carrito-movil::-webkit-scrollbar-thumb {
        background: #1a5d37;
        border-radius: 10px;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex flex-col">
    <header
      class="bg-white shadow-sm flex flex-col items-center pt-2 pb-4 px-4"
    >
      <div class="flex justify-center w-full">
        <img
          src="Logo.png"
          class="h-28 md:h-48 object-contain"
          alt="Mayorista Pueblo"
        />
      </div>
      <div class="flex items-center justify-center gap-6 -mt-4 md:-mt-8">
        <a
          href="https://wa.me/543413261010"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
            alt="WA"
            style="width: 42px; height: 42px"
          />
        </a>
        <a
          href="https://www.instagram.com/mayoristapueblo/"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
            alt="IG"
            style="width: 34px; height: 34px"
          />
        </a>
        <a
          href="https://www.facebook.com/profile.php?id=61587995854029"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
            alt="FB"
            style="width: 34px; height: 34px"
          />
        </a>
      </div>
    </header>

    <main class="flex flex-col md:flex-row flex-1 p-4 gap-6">
      <aside class="w-full md:w-64 space-y-2">
        <h2
          class="font-bold text-mayorista mb-4 uppercase tracking-wider text-sm"
        >
          Categorías
        </h2>
        <div class="flex md:flex-col gap-2 overflow-x-auto pb-2">
          <button
            onclick="filtrar('TODOS', this)"
            class="categoria-btn bg-mayorista text-white px-4 py-2 rounded-lg font-bold w-full text-left whitespace-nowrap"
          >
            TODOS
          </button>
          <button
            onclick="filtrar('BELLEZA', this)"
            class="categoria-btn bg-white border px-4 py-2 rounded-lg font-bold w-full text-left hover:bg-green-800 hover:text-white transition-colors whitespace-nowrap"
          >
            BELLEZA
          </button>
          <button
            onclick="filtrar('COCINA', this)"
            class="categoria-btn bg-white border px-4 py-2 rounded-lg font-bold w-full text-left hover:bg-green-800 hover:text-white transition-colors whitespace-nowrap"
          >
            COCINA
          </button>
          <button
            onclick="filtrar('DECO', this)"
            class="categoria-btn bg-white border px-4 py-2 rounded-lg font-bold w-full text-left hover:bg-green-800 hover:text-white transition-colors whitespace-nowrap"
          >
            DECO
          </button>
        </div>
      </aside>

      <section class="flex-1">
        <input
          type="text"
          id="buscador"
          onkeyup="buscar()"
          placeholder="Buscar producto o código..."
          class="w-full p-3 rounded-xl border-2 mb-6 outline-none focus:border-mayorista shadow-sm"
        />
        <div
          id="contenedor-productos"
          class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4 pb-24 md:pb-0"
        ></div>
      </section>

      <aside class="hidden md:block w-full md:w-80">
        <div
          class="bg-white p-6 rounded-3xl shadow-xl sticky top-4 border-none"
        >
          <h2 class="font-black text-xl mb-4 text-mayorista">MI PEDIDO</h2>
          <div
            id="items-carrito"
            class="space-y-3 mb-6 max-h-96 overflow-y-auto"
          >
            <p class="text-gray-400 italic text-center py-4">
              No hay productos aún.
            </p>
          </div>
          <div class="border-t pt-4">
            <div class="flex justify-between text-2xl font-black mb-6">
              <span>Total:</span>
              <span id="total-pedido">$0</span>
            </div>
            <button
              onclick="enviarWhatsApp()"
              class="w-full bg-mayorista text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-green-800"
            >
              ENVIAR WHATSAPP
            </button>
          </div>
        </div>
      </aside>
    </main>

    <div
      id="btn-flotante-container"
      class="fixed bottom-6 left-4 right-4 md:hidden z-50 hidden"
    >
      <button
        onclick="toggleCarritoMovil()"
        class="w-full bg-mayorista text-white py-4 rounded-2xl font-bold shadow-2xl flex justify-between px-6 items-center"
      >
        <div class="flex items-center gap-2">
          <span
            class="bg-white text-mayorista rounded-full w-6 h-6 flex items-center justify-center text-xs"
            id="cantidad-flotante"
            >0</span
          >
          <span>Ver Pedido</span>
        </div>
        <span id="total-flotante" class="text-lg">$0</span>
      </button>
    </div>

    <div
      id="modal-carrito"
      class="fixed inset-0 bg-black/60 hidden z-[60] p-4 items-center justify-center"
    >
      <div
        class="bg-white w-full max-w-sm rounded-3xl p-6 flex flex-col max-h-[85vh] shadow-2xl"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-black text-xl text-mayorista">TU PEDIDO</h2>
          <button onclick="toggleCarritoMovil()" class="text-gray-400 text-3xl">
            &times;
          </button>
        </div>
        <div
          id="items-carrito-movil"
          class="space-y-4 mb-6 overflow-y-auto pr-2"
        ></div>
        <div class="border-t pt-4">
          <div class="flex justify-between text-2xl font-black mb-4">
            <span>Total:</span>
            <span id="total-pedido-movil">$0</span>
          </div>
          <div class="flex flex-col gap-2">
            <button
              onclick="enviarWhatsApp()"
              class="w-full bg-mayorista text-white py-4 rounded-xl font-bold shadow-lg"
            >
              CONFIRMAR POR WHATSAPP
            </button>
            <button
              onclick="toggleCarritoMovil()"
              class="w-full bg-gray-100 py-3 rounded-xl font-bold text-gray-500 text-sm"
            >
              SEGUIR COMPRANDO
            </button>
          </div>
        </div>
      </div>
    </div>

    <div
      id="modal-foto"
      onclick="this.style.display = 'none'"
      class="fixed inset-0 bg-black/90 hidden z-[70] items-center justify-center p-4"
    >
      <img
        id="foto-ampliada"
        class="max-w-full max-h-full rounded-lg shadow-2xl"
      />
    </div>

    <script src="productos.js?v=1.4"></script>

    <script>
      let carrito = [];
      function precioARS(n) {
        return n.toLocaleString("es-AR");
      }

      function mostrarProductos(lista) {
        const cont = document.getElementById("contenedor-productos");
        cont.innerHTML = lista
          .map((p) => {
            const hayStock = p.stock !== false;
            return `
                <div class="bg-white p-2 md:p-4 rounded-2xl border ${hayStock ? "hover:border-mayorista" : "opacity-60"} shadow-sm flex flex-col">
                    <div class="w-full h-32 md:h-44 bg-white rounded-xl mb-2 md:mb-4 border flex items-center justify-center p-2 relative">
                        <img src="${p.foto}" alt="${p.nombre}" loading="lazy" onclick="ampliar('${p.foto}')" class="max-h-full max-w-full object-contain cursor-zoom-in aspect-square">
                        ${!hayStock ? '<span class="absolute top-2 right-2 bg-red-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">AGOTADO</span>' : ""}
                    </div>
                    <p class="text-[10px] font-mono text-gray-400">${p.id}</p>
                    <h3 class="font-bold text-gray-800 text-xs md:text-base min-h-[35px] md:min-h-[48px] leading-tight overflow-hidden">${p.nombre}</h3>
                    <p class="text-base md:text-2xl font-black text-mayorista mt-1 md:mt-2">$${precioARS(p.precio)}</p>
                    ${
                      hayStock
                        ? `<button onclick="agregarAlCarrito('${p.id}')" class="w-full mt-2 md:mt-4 bg-gray-100 py-2 md:py-3 rounded-xl font-bold text-xs md:text-base hover:bg-mayorista hover:text-white transition-colors">+ Agregar</button>`
                        : `<button disabled class="w-full mt-2 md:mt-4 bg-gray-200 text-gray-400 py-2 md:py-3 rounded-xl font-bold text-xs md:text-base cursor-not-allowed">Sin Stock</button>`
                    }
                </div>`;
          })
          .join("");
      }

      function activarBoton(btn) {
        document.querySelectorAll(".categoria-btn").forEach((b) => {
          b.classList.remove("bg-mayorista", "text-white");
          b.classList.add("bg-white");
        });
        btn.classList.remove("bg-white");
        btn.classList.add("bg-mayorista", "text-white");
      }

      function filtrar(c, btn) {
        if (btn) activarBoton(btn);
        const filtrados =
          c === "TODOS" ? productos : productos.filter((p) => p.cat === c);
        mostrarProductos(filtrados);
      }

      function agregarAlCarrito(id) {
        const prod = productos.find((p) => p.id === id);
        const existe = carrito.find((i) => i.id === id);
        if (existe) {
          existe.cantidad++;
        } else {
          carrito.push({ ...prod, cantidad: 1 });
        }
        actualizarCarrito();
      }

      function actualizarCarrito() {
        const listaPC = document.getElementById("items-carrito");
        const listaMovil = document.getElementById("items-carrito-movil");
        const totalTxt = document.getElementById("total-pedido");
        const totalMovilTxt = document.getElementById("total-pedido-movil");
        const totalFlotante = document.getElementById("total-flotante");
        const cantidadFlotante = document.getElementById("cantidad-flotante");
        const btnContenedor = document.getElementById("btn-flotante-container");

        let html = "";
        let total = 0;
        let cantidadTotal = 0;

        carrito.forEach((item) => {
          total += item.precio * item.cantidad;
          cantidadTotal += item.cantidad;
          html += `
                <div class="flex justify-between items-center border-b pb-3 gap-2">
                    <div class="flex-1">
                        <p class="font-bold text-sm leading-tight text-gray-800">${item.nombre}</p>
                        <p class="text-xs text-gray-500">${item.cantidad} x $${precioARS(item.precio)}</p>
                    </div>
                    <button onclick="eliminar('${item.id}')" class="text-red-500 text-xs font-bold bg-red-50 px-3 py-2 rounded-lg">Quitar</button>
                </div>`;
        });

        if (carrito.length > 0) {
          btnContenedor.classList.remove("hidden");
        } else {
          btnContenedor.classList.add("hidden");
        }

        const vacio =
          '<p class="text-gray-400 italic text-center py-4">No hay productos aún.</p>';
        listaPC.innerHTML = carrito.length === 0 ? vacio : html;
        listaMovil.innerHTML = carrito.length === 0 ? vacio : html;

        const totalF = "$" + precioARS(total);
        totalTxt.innerText = totalF;
        totalMovilTxt.innerText = totalF;
        totalFlotante.innerText = totalF;
        cantidadFlotante.innerText = cantidadTotal;

        localStorage.setItem("carrito", JSON.stringify(carrito));
      }

      function eliminar(id) {
        carrito = carrito.filter((i) => i.id !== id);
        actualizarCarrito();
      }

      function toggleCarritoMovil() {
        const modal = document.getElementById("modal-carrito");
        modal.classList.toggle("hidden");
        modal.classList.toggle("flex");
      }

      function enviarWhatsApp() {
        if (carrito.length === 0) {
          alert("Tu carrito está vacío");
          return;
        }
        let mensaje =
          "Hola Mayorista Pueblo, quiero hacer el siguiente pedido:\n\n";
        let total = 0;
        carrito.forEach((item) => {
          mensaje += `• ${item.nombre} [${item.id}] x ${item.cantidad} - $${precioARS(item.precio * item.cantidad)}\n`;
          total += item.precio * item.cantidad;
        });
        mensaje += `\nTOTAL ESTIMADO: $${precioARS(total)}`;
        window.open(
          `https://wa.me/543413261010?text=${encodeURIComponent(mensaje)}`,
        );
      }

      function ampliar(src) {
        document.getElementById("foto-ampliada").src = src;
        document.getElementById("modal-foto").style.display = "flex";
      }

      function buscar() {
        const t = document.getElementById("buscador").value.toUpperCase();
        const filtrados = productos.filter(
          (p) =>
            p.nombre.toUpperCase().includes(t) ||
            p.id.toUpperCase().includes(t),
        );
        mostrarProductos(filtrados);
      }

      window.onload = () => {
        const guardado = localStorage.getItem("carrito");
        if (guardado) {
          carrito = JSON.parse(guardado);
        }
        mostrarProductos(productos);
        actualizarCarrito();
      };
    </script>
  </body>
</html>
