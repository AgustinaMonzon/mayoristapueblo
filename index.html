    <script>
      (function () {
        const v = Date.now(); // Genera un número único basado en la hora actual

        // Cargar productos.js
        const prodScript = document.createElement("script");
        prodScript.src = `productos.js?v=${v}`;
        document.body.appendChild(prodScript);

        // Cargar service-worker.js (esto es para el script de registro, no el registro en sí)
        // Pero lo más importante es registrar el SW con la nueva lógica:
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register(`service-worker.js?v=${v}`)
            .then((reg) => {
              reg.update(); // Fuerza al navegador a buscar cambios en el SW
              console.log("SW registrado con versión:", v);
            });
        }
      })();
    </script>

    <script>
      let carrito = [];
      let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];
      let categoriaActual = "TODOS";

      function precioARS(n) {
        return typeof n === "number" ? n.toLocaleString("es-AR") : n;
      }

      function toggleFavorito(id) {
        if (favoritos.includes(id)) {
          favoritos = favoritos.filter((f) => f !== id);
        } else {
          favoritos.push(id);
        }
        localStorage.setItem("favoritos", JSON.stringify(favoritos));
        aplicarFiltros();
      }

      function mostrarProductos(lista) {
        const cont = document.getElementById("contenedor-productos");
        if (lista.length === 0) {
          cont.innerHTML = `<div class="col-span-full py-20 text-center text-gray-400 text-sm italic">No se encontraron productos en esta sección.</div>`;
          return;
        }
        cont.innerHTML = lista
          .map((p) => {
            const hayStock = p.stock !== false;
            const esFav = favoritos.includes(p.id);

            const tieneOferta = p.oferta && p.precioAnterior;
            const precioHTML = tieneOferta
              ? `<div class="flex flex-col">
                  <span class="text-gray-400 line-through text-[10px] md:text-sm">$${precioARS(p.precioAnterior)}</span>
                  <span class="text-red-600 font-black text-base md:text-xl animate-pulse">$${precioARS(p.precio)}</span>
                 </div>`
              : `<p class="text-base md:text-xl font-black text-pueblo">${typeof p.precio === "number" ? "$" + precioARS(p.precio) : p.precio}</p>`;

            return `
            <div class="bg-white p-2 md:p-4 rounded-2xl border ${hayStock ? "hover:border-pueblo" : "opacity-60"} shadow-sm flex flex-col relative">
              <button onclick="toggleFavorito('${p.id}')" class="absolute top-4 left-4 z-10 bg-white/80 p-1.5 rounded-full shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${esFav ? "fill-red-500 text-red-500" : "text-gray-400"}" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg>
              </button>
              <div class="w-full aspect-square bg-white rounded-xl mb-2 md:mb-4 border flex items-center justify-center overflow-hidden relative">
                <img src="${p.foto}" loading="lazy" onclick="ampliar('${p.foto}')" class="w-full h-full object-cover cursor-zoom-in">
                ${!hayStock ? '<span class="absolute top-2 right-2 bg-red-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">AGOTADO</span>' : ""}
                ${p.oferta ? '<span class="absolute top-2 right-2 bg-red-500 text-white text-[10px] px-2 py-1 rounded-full font-bold animate-pulse">OFERTA</span>' : ""}
              </div>
              <p class="text-[10px] font-mono text-gray-400 uppercase">${p.id}</p>
              <h3 class="font-bold text-gray-800 text-xs md:text-base min-h-[35px] md:min-h-[48px] leading-tight mb-2">${p.nombre}</h3>
              ${precioHTML}
              ${
                hayStock
                  ? `
                <div class="flex items-center justify-between mt-3 bg-gray-50 rounded-xl p-1 border">
                  <button onclick="cambiarCantCarta('${p.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg font-bold text-pueblo shadow-sm">-</button>
                  <span id="cant-${p.id}" class="font-bold text-sm">1</span>
                  <button onclick="cambiarCantCarta('${p.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg font-bold text-pueblo shadow-sm">+</button>
                </div>
                <button onclick="prepararAlta('${p.id}')" class="w-full mt-2 bg-pueblo text-white py-2 rounded-xl font-bold text-xs uppercase">Agregar</button>
              `
                  : `<button disabled class="w-full mt-2 bg-gray-200 text-gray-400 py-2 rounded-xl font-bold text-xs">Sin Stock</button>`
              }
            </div>`;
          })
          .join("");
      }

      function filtrar(c, btn) {
        categoriaActual = c;
        document.querySelectorAll(".categoria-btn").forEach((b) => {
          b.classList.remove("bg-pueblo", "bg-red-600", "text-white");
          b.classList.add("bg-white", "text-gray-700");
        });
        if (c === "SALE") btn.classList.add("bg-red-600", "text-white");
        else btn.classList.add("bg-pueblo", "text-white");
        btn.classList.remove("bg-white", "text-gray-700");
        aplicarFiltros();
      }

      function aplicarFiltros() {
        const texto = document.getElementById("buscador").value.toUpperCase();
        const orden = document.getElementById("ordenar").value;
        let filtrados = JSON.parse(JSON.stringify(productos));

        if (categoriaActual === "SALE")
          filtrados = filtrados.filter((p) => p.oferta === true);
        else if (categoriaActual === "FAVORITOS")
          filtrados = filtrados.filter((p) => favoritos.includes(p.id));
        else if (categoriaActual !== "TODOS")
          filtrados = filtrados.filter((p) => p.cat === categoriaActual);

        if (texto) {
          filtrados = filtrados.filter(
            (p) =>
              p.nombre.toUpperCase().includes(texto) ||
              p.id.toUpperCase().includes(texto),
          );
        }

        if (orden === "menor") filtrados.sort((a, b) => a.precio - b.precio);
        else if (orden === "mayor")
          filtrados.sort((a, b) => b.precio - a.precio);

        mostrarProductos(filtrados);
      }

      function buscar() {
        aplicarFiltros();
      }

      function cambiarCantCarta(id, cambio) {
        const el = document.getElementById(`cant-${id}`);
        if (el) {
          let actual = parseInt(el.innerText);
          if (actual + cambio >= 1) el.innerText = actual + cambio;
        }
      }

      function prepararAlta(id) {
        const cantEl = document.getElementById(`cant-${id}`);
        if (cantEl) {
          agregarAlCarrito(id, parseInt(cantEl.innerText));
          cantEl.innerText = "1";
        }
      }

      function agregarAlCarrito(id, cantidad) {
        const prod = productos.find((p) => p.id === id);
        const existe = carrito.find((i) => i.id === id);
        if (existe) existe.cantidad += cantidad;
        else carrito.push({ ...prod, cantidad: cantidad });
        actualizarCarrito();
      }

      function modificarEnCarrito(id, cambio) {
        const item = carrito.find((i) => i.id === id);
        if (item) {
          item.cantidad += cambio;
          if (item.cantidad <= 0) eliminar(id);
          else actualizarCarrito();
        }
      }

      function actualizarCarrito() {
        const listaPC = document.getElementById("items-carrito");
        const listaMovil = document.getElementById("items-carrito-movil");
        let html = "";
        let total = 0;
        let cantidadTotal = 0;

        carrito.forEach((item) => {
          const subtotal =
            typeof item.precio === "number" ? item.precio * item.cantidad : 0;
          total += subtotal;
          cantidadTotal += item.cantidad;
          html += `
            <div class="flex justify-between items-center border-b py-3 gap-2">
              <div class="flex-1 text-xs">
                <p class="font-bold text-gray-800">${item.nombre}</p>
                <p class="text-pueblo font-bold">${subtotal > 0 ? "$" + precioARS(subtotal) : item.precio}</p>
              </div>
              <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-lg">
                <button onclick="modificarEnCarrito('${item.id}', -1)" class="bg-white border px-2 rounded font-bold text-pueblo">-</button>
                <span class="font-bold w-4 text-center">${item.cantidad}</span>
                <button onclick="modificarEnCarrito('${item.id}', 1)" class="bg-white border px-2 rounded font-bold text-pueblo">+</button>
              </div>
              <button onclick="eliminar('${item.id}')" class="text-red-400 font-bold text-lg px-1">&times;</button>
            </div>`;
        });

        const vacio =
          '<p class="text-gray-400 italic text-center py-4 text-sm">El carrito está vacío.</p>';
        if (listaPC) listaPC.innerHTML = carrito.length === 0 ? vacio : html;
        if (listaMovil)
          listaMovil.innerHTML = carrito.length === 0 ? vacio : html;

        document.getElementById("total-pedido").innerText =
          "$" + precioARS(total);
        document.getElementById("total-pedido-movil").innerText =
          "$" + precioARS(total);
        document.getElementById("total-flotante").innerText =
          "$" + precioARS(total);
        document.getElementById("cantidad-flotante").innerText = cantidadTotal;
        document
          .getElementById("btn-flotante-container")
          .classList.toggle("hidden", carrito.length === 0);

        localStorage.setItem("carrito_pueblo", JSON.stringify(carrito));
      }

      function eliminar(id) {
        carrito = carrito.filter((i) => i.id !== id);
        actualizarCarrito();
      }

      function toggleCarritoMovil() {
        const m = document.getElementById("modal-carrito");
        m.classList.toggle("hidden");
        m.classList.toggle("flex");
      }

      function enviarWhatsApp() {
        if (carrito.length === 0) return;

        let m = "Hola Tienda Pueblo, quiero realizar este pedido:\n\n";
        let total = 0;

        carrito.forEach((i) => {
          const subtotal =
            typeof i.precio === "number" ? i.precio * i.cantidad : 0;

          m += `• [${i.id}] ${i.nombre} (x${i.cantidad}) - ${subtotal > 0 ? "$" + precioARS(subtotal) : i.precio}\n`;

          total += subtotal;
        });

        m += `\nTOTAL: $${precioARS(total)}`;

        // Abrir WhatsApp con el nuevo formato
        window.open(`https://wa.me/543413261010?text=${encodeURIComponent(m)}`);
      }

      function ampliar(src) {
        document.getElementById("foto-ampliada").src = src;
        document.getElementById("modal-foto").classList.remove("hidden");
        document.getElementById("modal-foto").classList.add("flex");
      }

      window.onload = () => {
        const g = localStorage.getItem("carrito_pueblo");
        if (g) carrito = JSON.parse(g);

        // Esperamos un segundo para asegurar que productos.js cargó (por la carga dinámica)
        setTimeout(() => {
          if (typeof productos !== "undefined") {
            mostrarProductos(productos);
          }
        }, 100);

        actualizarCarrito();
      };
    </script>
  </body>
</html>
