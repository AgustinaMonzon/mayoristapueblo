<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayorista Pueblo - Pedidos</title>
    <link rel="icon" href="Logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a5d37" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-mayorista {
        background: #1a5d37;
      }
      .text-mayorista {
        color: #1a5d37;
      }
      .border-mayorista {
        border-color: #1a5d37;
      }
      .icon-social {
        transition: transform 0.2s;
      }
      .icon-social:hover {
        transform: scale(1.15);
      }
      .scroll-hidden::-webkit-scrollbar {
        display: none;
      }
      .scroll-hidden {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      #items-carrito-movil::-webkit-scrollbar {
        width: 4px;
      }
      #items-carrito-movil::-webkit-scrollbar-thumb {
        background: #1a5d37;
        border-radius: 10px;
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex flex-col">
    <header
      class="bg-white shadow-sm flex flex-col items-center pt-2 pb-4 px-4"
    >
      <div class="flex justify-center w-full">
        <img
          src="Logo.png"
          class="h-28 md:h-40 object-contain"
          alt="Mayorista Pueblo"
        />
      </div>
      <div class="flex items-center justify-center gap-6 -mt-4 md:-mt-6">
        <a
          href="https://wa.me/543413261010"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
            alt="WA"
            style="width: 38px; height: 38px"
          />
        </a>
        <a
          href="https://www.instagram.com/mayoristapueblo/"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
            alt="IG"
            style="width: 30px; height: 30px"
          />
        </a>
        <a
          href="https://www.facebook.com/profile.php?id=61587995854029"
          target="_blank"
          class="icon-social"
        >
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
            alt="FB"
            style="width: 30px; height: 30px"
          />
        </a>
      </div>
    </header>

    <main
      class="flex flex-col md:flex-row flex-1 p-4 gap-4 max-w-[1400px] mx-auto w-full"
    >
      <aside class="w-full md:w-48 space-y-2">
        <h2
          class="font-bold text-mayorista mb-4 uppercase tracking-wider text-xs hidden md:block"
        >
          Categorías
        </h2>
        <div class="flex md:flex-col gap-2 overflow-x-auto pb-2 scroll-hidden">
          <button
            onclick="filtrar('TODOS', this)"
            class="categoria-btn bg-mayorista text-white px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border shadow-sm transition-all"
          >
            TODOS
          </button>
          <button
            onclick="filtrar('AURICULARES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            AURICULARES
          </button>
          <button
            onclick="filtrar('BELLEZA', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            BELLEZA
          </button>
          <button
            onclick="filtrar('CARGADORES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            CARGADORES
          </button>
          <button
            onclick="filtrar('DECO', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            DECO
          </button>
          <button
            onclick="filtrar('DEPORTIVO', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            DEPORTIVO
          </button>
          <button
            onclick="filtrar('HOGAR', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            HOGAR
          </button>
          <button
            onclick="filtrar('INFORMÁTICA', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            INFORMÁTICA
          </button>
          <button
            onclick="filtrar('JUGUETES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            JUGUETES
          </button>
          <button
            onclick="filtrar('LIBRERÍA', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            LIBRERÍA
          </button>
          <button
            onclick="filtrar('MICRÓFONOS', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            MICRÓFONOS
          </button>
          <button
            onclick="filtrar('PARLANTES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            PARLANTES
          </button>
          <button
            onclick="filtrar('PROYECTORES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            PROYECTORES
          </button>
          <button
            onclick="filtrar('RELOJES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border hover:bg-gray-50 transition-all"
          >
            RELOJES
          </button>
        </div>
      </aside>

      <section class="flex-1">
        <div class="flex flex-col md:flex-row gap-2 mb-6">
          <input
            type="text"
            id="buscador"
            onkeyup="buscar()"
            placeholder="Buscar producto o código..."
            class="flex-1 p-3 rounded-xl border-2 outline-none focus:border-mayorista shadow-sm"
          />
          <select
            id="ordenar"
            onchange="aplicarFiltros()"
            class="p-3 rounded-xl border-2 outline-none bg-white font-bold text-gray-600"
          >
            <option value="predeterminado">Ordenar por</option>
            <option value="menor">Precio: Menor a Mayor</option>
            <option value="mayor">Precio: Mayor a Menor</option>
          </select>
        </div>
        <div
          id="contenedor-productos"
          class="grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-5 pb-24 md:pb-0"
        ></div>
      </section>

      <aside class="hidden md:block w-72">
        <div class="bg-white p-6 rounded-3xl shadow-xl sticky top-4 border">
          <h2 class="font-black text-xl mb-4 text-mayorista uppercase">
            Mi Pedido
          </h2>
          <div
            id="items-carrito"
            class="space-y-3 mb-6 max-h-[50vh] overflow-y-auto scroll-hidden"
          ></div>
          <div class="border-t pt-4">
            <div class="flex justify-between text-2xl font-black mb-6">
              <span>Total:</span>
              <span id="total-pedido">$0</span>
            </div>
            <button
              onclick="enviarWhatsApp()"
              class="w-full bg-mayorista text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-green-900 transition-colors"
            >
              ENVIAR WHATSAPP
            </button>
          </div>
        </div>
      </aside>
    </main>

    <div
      id="btn-flotante-container"
      class="fixed bottom-6 left-4 right-4 md:hidden z-50 hidden"
    >
      <button
        onclick="toggleCarritoMovil()"
        class="w-full bg-mayorista text-white py-4 rounded-2xl font-bold shadow-2xl flex justify-between px-6 items-center"
      >
        <div class="flex items-center gap-2">
          <span
            class="bg-white text-mayorista rounded-full w-6 h-6 flex items-center justify-center text-xs"
            id="cantidad-flotante"
            >0</span
          >
          <span>Ver Pedido</span>
        </div>
        <span id="total-flotante" class="text-lg">$0</span>
      </button>
    </div>

    <div
      id="modal-carrito"
      class="fixed inset-0 bg-black/60 hidden z-[60] p-4 items-center justify-center"
    >
      <div
        class="bg-white w-full max-w-sm rounded-3xl p-6 flex flex-col max-h-[85vh] shadow-2xl"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-black text-xl text-mayorista">TU PEDIDO</h2>
          <button onclick="toggleCarritoMovil()" class="text-gray-400 text-3xl">
            &times;
          </button>
        </div>
        <div
          id="items-carrito-movil"
          class="space-y-4 mb-6 overflow-y-auto pr-2"
        ></div>
        <div class="border-t pt-4">
          <div class="flex justify-between text-2xl font-black mb-4">
            <span>Total:</span>
            <span id="total-pedido-movil">$0</span>
          </div>
          <button
            onclick="enviarWhatsApp()"
            class="w-full bg-mayorista text-white py-4 rounded-xl font-bold mb-2"
          >
            CONFIRMAR WHATSAPP
          </button>
          <button
            onclick="toggleCarritoMovil()"
            class="w-full bg-gray-100 py-3 rounded-xl font-bold text-gray-500 text-sm"
          >
            SEGUIR COMPRANDO
          </button>
        </div>
      </div>
    </div>

    <div
      id="modal-foto"
      onclick="this.style.display = 'none'"
      class="fixed inset-0 bg-black/90 hidden z-[70] items-center justify-center p-4"
    >
      <img id="foto-ampliada" class="max-w-full max-h-full rounded-lg" />
    </div>

    <script src="productos.js?v=1.6"></script>
    <script>
      let carrito = [];
      let categoriaActual = "TODOS";
      function precioARS(n) {
        return n.toLocaleString("es-AR");
      }

      function mostrarProductos(lista) {
        const cont = document.getElementById("contenedor-productos");
        cont.innerHTML = lista
          .map((p) => {
            const hayStock = p.stock !== false;
            return `
            <div class="bg-white p-2 md:p-4 rounded-2xl border ${hayStock ? "hover:border-mayorista" : "opacity-60"} shadow-sm flex flex-col">
              <div class="w-full aspect-square bg-white rounded-xl mb-2 md:mb-4 border flex items-center justify-center overflow-hidden relative shadow-inner">
                <img src="${p.foto}" alt="${p.nombre}" loading="lazy" onclick="ampliar('${p.foto}')" class="w-full h-full object-cover cursor-zoom-in">
                ${!hayStock ? '<span class="absolute top-2 right-2 bg-red-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">AGOTADO</span>' : ""}
              </div>
              <p class="text-[10px] font-mono text-gray-400">${p.id}</p>
              <h3 class="font-bold text-gray-800 text-xs md:text-base min-h-[35px] md:min-h-[48px] leading-tight mb-2">${p.nombre}</h3>
              <p class="text-base md:text-xl font-black text-mayorista">$${precioARS(p.precio)}</p>
              ${
                hayStock
                  ? `
                <div class="flex items-center justify-between mt-3 bg-gray-50 rounded-xl p-1 border">
                  <button onclick="cambiarCantCarta('${p.id}', -1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg font-bold text-mayorista shadow-sm">-</button>
                  <span id="cant-${p.id}" class="font-bold text-sm">1</span>
                  <button onclick="cambiarCantCarta('${p.id}', 1)" class="w-7 h-7 flex items-center justify-center bg-white rounded-lg font-bold text-mayorista shadow-sm">+</button>
                </div>
                <button onclick="prepararAlta('${p.id}')" class="w-full mt-2 bg-mayorista text-white py-2 rounded-xl font-bold text-xs hover:bg-green-800 transition-colors">Añadir</button>
              `
                  : `<button disabled class="w-full mt-2 bg-gray-200 text-gray-400 py-2 rounded-xl font-bold text-xs">Sin Stock</button>`
              }
            </div>`;
          })
          .join("");
      }

      function filtrar(c, btn) {
        categoriaActual = c;
        if (btn) {
          document.querySelectorAll(".categoria-btn").forEach((b) => {
            b.classList.remove("bg-mayorista", "text-white");
            b.classList.add("bg-white", "text-gray-700");
          });
          btn.classList.add("bg-mayorista", "text-white");
          btn.classList.remove("bg-white", "text-gray-700");
        }
        aplicarFiltros();
      }

      function aplicarFiltros() {
        const texto = document.getElementById("buscador").value.toUpperCase();
        const orden = document.getElementById("ordenar").value;
        let filtrados =
          categoriaActual === "TODOS"
            ? productos
            : productos.filter((p) => p.cat === categoriaActual);
        if (texto)
          filtrados = filtrados.filter(
            (p) =>
              p.nombre.toUpperCase().includes(texto) ||
              p.id.toUpperCase().includes(texto),
          );
        if (orden === "menor") filtrados.sort((a, b) => a.precio - b.precio);
        else if (orden === "mayor")
          filtrados.sort((a, b) => b.precio - a.precio);
        mostrarProductos(filtrados);
      }

      function buscar() {
        aplicarFiltros();
      }
      function cambiarCantCarta(id, cambio) {
        const el = document.getElementById(`cant-${id}`);
        let actual = parseInt(el.innerText);
        if (actual + cambio >= 1) el.innerText = actual + cambio;
      }
      function prepararAlta(id) {
        const cant = parseInt(document.getElementById(`cant-${id}`).innerText);
        agregarAlCarrito(id, cant);
        document.getElementById(`cant-${id}`).innerText = "1";
      }
      function agregarAlCarrito(id, cantidad) {
        const prod = productos.find((p) => p.id === id);
        const existe = carrito.find((i) => i.id === id);
        if (existe) existe.cantidad += cantidad;
        else carrito.push({ ...prod, cantidad: cantidad });
        actualizarCarrito();
      }
      function modificarEnCarrito(id, cambio) {
        const item = carrito.find((i) => i.id === id);
        if (item) {
          item.cantidad += cambio;
          if (item.cantidad <= 0) eliminar(id);
          else actualizarCarrito();
        }
      }
      function actualizarCarrito() {
        const listaPC = document.getElementById("items-carrito");
        const listaMovil = document.getElementById("items-carrito-movil");
        let html = "";
        let total = 0;
        let cantidadTotal = 0;
        carrito.forEach((item) => {
          total += item.precio * item.cantidad;
          cantidadTotal += item.cantidad;
          html += `<div class="flex justify-between items-center border-b py-3 gap-2"><div class="flex-1 text-xs"><p class="font-bold leading-tight text-gray-800">${item.nombre}</p><p class="text-mayorista font-bold">$${precioARS(item.precio * item.cantidad)}</p></div><div class="flex items-center gap-2 bg-gray-50 p-1 rounded-lg"><button onclick="modificarEnCarrito('${item.id}', -1)" class="bg-white border px-2 rounded font-bold text-mayorista">-</button><span class="font-bold w-4 text-center">${item.cantidad}</span><button onclick="modificarEnCarrito('${item.id}', 1)" class="bg-white border px-2 rounded font-bold text-mayorista">+</button></div><button onclick="eliminar('${item.id}')" class="text-red-400">&times;</button></div>`;
        });
        document
          .getElementById("btn-flotante-container")
          .classList.toggle("hidden", carrito.length === 0);
        const vacio =
          '<p class="text-gray-400 italic text-center py-4">No hay productos aún.</p>';
        listaPC.innerHTML = carrito.length === 0 ? vacio : html;
        listaMovil.innerHTML = carrito.length === 0 ? vacio : html;
        const tStr = "$" + precioARS(total);
        document.getElementById("total-pedido").innerText = tStr;
        document.getElementById("total-pedido-movil").innerText = tStr;
        document.getElementById("total-flotante").innerText = tStr;
        document.getElementById("cantidad-flotante").innerText = cantidadTotal;
        localStorage.setItem("carrito", JSON.stringify(carrito));
      }
      function eliminar(id) {
        carrito = carrito.filter((i) => i.id !== id);
        actualizarCarrito();
      }
      function toggleCarritoMovil() {
        const m = document.getElementById("modal-carrito");
        m.classList.toggle("hidden");
        m.classList.toggle("flex");
      }
      function enviarWhatsApp() {
        if (carrito.length === 0) return alert("Carrito vacío");
        let m = "Hola Mayorista Pueblo, este es mi pedido:\n\n";
        let total = 0;
        carrito.forEach((i) => {
          m += `• ${i.nombre} x${i.cantidad} - $${precioARS(i.precio * i.cantidad)}\n`;
          total += i.precio * i.cantidad;
        });
        m += `\nTOTAL: $${precioARS(total)}`;
        window.open(`https://wa.me/543413261010?text=${encodeURIComponent(m)}`);
      }
      function ampliar(src) {
        document.getElementById("foto-ampliada").src = src;
        document.getElementById("modal-foto").style.display = "flex";
      }
      window.onload = () => {
        const g = localStorage.getItem("carrito");
        if (g) carrito = JSON.parse(g);
        mostrarProductos(productos);
        actualizarCarrito();
      };
    </script>
  </body>
</html>
