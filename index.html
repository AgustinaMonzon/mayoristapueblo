<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda Pueblo - Pedidos</title>
    <link rel="icon" href="logo.webp" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1a5d37" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-pueblo {
        background: #1a5d37;
      }
      .text-pueblo {
        color: #1a5d37;
      }
      .border-pueblo {
        border-color: #1a5d37;
      }
      .btn-ya-agregado {
        background-color: #2da44e !important;
        transform: scale(0.98);
      }

      /* Animaciones */
      @keyframes pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1);
        }
      }
      .animar-pop {
        animation: pop 0.3s ease-out;
      }

      @keyframes titileo {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .oferta-titilando {
        animation: titileo 1s infinite;
        color: #e11d48;
        font-weight: 800;
      }

      /* Scroll invisible */
      .scroll-hidden::-webkit-scrollbar {
        display: none;
      }
      .scroll-hidden {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Ajuste de imagen en el modal */
      #foto-ampliada {
        max-height: 45vh; /* Evita que la imagen sea demasiado grande verticalmente */
        width: auto;
        object-fit: contain;
      }

      .btn-whatsapp-flotante {
        position: fixed;
        bottom: 90px;
        right: 15px;
        background-color: #25d366;
        color: white;
        border-radius: 50px;
        padding: 8px 15px;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
      @media (min-width: 768px) {
        .btn-whatsapp-flotante {
          bottom: 30px;
        }
      }
    </style>
  </head>

  <body class="bg-gray-100 min-h-screen flex flex-col">
    <a
      href="https://wa.me/543413261010?text=Hola%20Tienda%20Pueblo!"
      target="_blank"
      class="btn-whatsapp-flotante"
    >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        width="22"
        height="22"
        alt="WA"
      />
      <span class="text-xs md:text-sm">CONSULTAS</span>
    </a>

    <header
      class="bg-white shadow-sm flex flex-col items-center pt-2 pb-4 px-4"
    >
      <img
        src="logo.webp"
        class="h-28 md:h-40 object-contain"
        alt="Tienda Pueblo"
      />
      <div class="flex items-center justify-center gap-6 -mt-4 md:-mt-6">
        <a href="https://wa.me/543413261010" target="_blank"
          ><img
            src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
            width="30"
        /></a>
        <a href="https://www.instagram.com/mayoristapueblo/" target="_blank"
          ><img
            src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"
            width="25"
        /></a>
        <a
          href="https://www.facebook.com/profile.php?id=61587995854029"
          target="_blank"
          ><img
            src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"
            width="25"
        /></a>
      </div>
    </header>

    <main
      class="flex flex-col md:flex-row flex-1 p-4 gap-4 max-w-[1400px] mx-auto w-full"
    >
      <aside class="w-full md:w-48 space-y-2">
        <div class="flex md:flex-col gap-2 overflow-x-auto pb-2 scroll-hidden">
          <button
            onclick="filtrar('TODOS', this)"
            class="categoria-btn bg-pueblo text-white px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border shadow-sm"
          >
            TODOS
          </button>
          <button
            onclick="filtrar('AURICULARES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border"
          >
            AURICULARES
          </button>
          <button
            onclick="filtrar('BELLEZA', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border"
          >
            BELLEZA
          </button>
          <button
            onclick="filtrar('CARGADORES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border"
          >
            CARGADORES
          </button>
          <button
            onclick="filtrar('CELULARES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border"
          >
            CELULARES
          </button>
          <button
            onclick="filtrar('RELOJES', this)"
            class="categoria-btn bg-white text-gray-700 px-4 py-2 rounded-lg font-bold md:w-full text-left whitespace-nowrap text-sm border"
          >
            RELOJES
          </button>
          <button
            onclick="filtrar('SALE', this)"
            class="categoria-btn bg-red-600 text-white px-4 py-2 rounded-lg font-bold md:w-full text-left mt-2 shadow-md"
          >
            🔥 SALE
          </button>
        </div>
      </aside>

      <section class="flex-1">
        <div class="flex flex-col md:flex-row gap-2 mb-6">
          <input
            type="text"
            id="buscador"
            onkeyup="buscar()"
            placeholder="Buscar por nombre o ID..."
            class="flex-1 p-3 rounded-xl border-2 outline-none focus:border-pueblo shadow-sm"
          />
          <select
            id="ordenar"
            onchange="aplicarFiltros()"
            class="p-3 rounded-xl border-2 bg-white font-bold text-gray-600"
          >
            <option value="predeterminado">Ordenar por</option>
            <option value="menor">Menor Precio</option>
            <option value="mayor">Mayor Precio</option>
          </select>
        </div>
        <div
          id="contenedor-productos"
          class="grid grid-cols-2 lg:grid-cols-3 gap-4"
        ></div>
      </section>

      <aside class="hidden md:block w-72">
        <div class="bg-white p-5 rounded-2xl shadow-lg sticky top-4 border">
          <h2
            class="font-black text-lg mb-4 text-pueblo uppercase tracking-tighter"
          >
            Mi Carrito
          </h2>
          <div
            id="items-carrito"
            class="space-y-3 mb-6 max-h-[60vh] overflow-y-auto scroll-hidden"
          ></div>
          <div class="border-t pt-4">
            <div class="flex justify-between text-xl font-black mb-4">
              <span>Total:</span><span id="total-pedido">$0</span>
            </div>
            <button
              onclick="enviarWhatsApp()"
              class="w-full bg-pueblo text-white py-3 rounded-xl font-bold shadow-lg hover:bg-green-800 transition-all uppercase"
            >
              Enviar Pedido
            </button>
          </div>
        </div>
      </aside>
    </main>

    <div
      id="modal-foto"
      class="fixed inset-0 bg-black/80 hidden z-[70] items-center justify-center p-4"
      onclick="cerrarModal()"
    >
      <div
        class="bg-white rounded-3xl max-w-lg w-full overflow-hidden flex flex-col animate-pop"
        onclick="event.stopPropagation()"
      >
        <div
          class="relative bg-gray-50 flex items-center justify-center p-4"
          style="min-height: 300px"
        >
          <img id="foto-ampliada" src="" alt="Producto" />
          <button
            onclick="cerrarModal()"
            class="absolute top-4 right-4 bg-white/90 text-gray-800 w-10 h-10 rounded-full flex items-center justify-center shadow-lg font-bold text-xl"
          >
            &times;
          </button>
        </div>
        <div class="p-6">
          <p
            id="id-ampliado"
            class="text-[10px] font-mono text-gray-400 uppercase mb-1"
          ></p>
          <h2
            id="titulo-ampliado"
            class="text-xl font-bold text-gray-800 leading-tight mb-3"
          ></h2>
          <div class="max-h-32 overflow-y-auto mb-6 pr-2">
            <p
              id="desc-ampliada"
              class="text-gray-600 text-sm leading-relaxed"
            ></p>
          </div>
          <div class="flex justify-between items-center border-t pt-4">
            <span
              id="precio-ampliado"
              class="text-2xl font-black text-pueblo"
            ></span>
            <button
              id="btn-modal-agregar"
              class="bg-pueblo text-white px-8 py-3 rounded-xl font-bold uppercase shadow-md active:scale-95"
            >
              Agregar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const v = Date.now();
        const s = document.createElement("script");
        s.src = `productos.js?v=${v}`;
        document.body.appendChild(s);
      })();
    </script>

    <script>
      let carrito = JSON.parse(localStorage.getItem("carrito_pueblo")) || [];
      let categoriaActual = "TODOS";
      let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

      function precioARS(n) {
        return n.toLocaleString("es-AR");
      }

      function mostrarProductos(lista) {
        const cont = document.getElementById("contenedor-productos");
        cont.innerHTML = lista
          .map((p) => {
            const hayStock = p.stock !== false;
            const yaEsta = carrito.find((i) => i.id === p.id);
            const foto = p.foto || `fotos/${p.id}.webp`;

            return `
            <div class="bg-white p-3 rounded-2xl border shadow-sm flex flex-col ${!hayStock ? "opacity-50" : ""}">
              <div class="aspect-square mb-2 relative flex items-center justify-center overflow-hidden bg-white">
                <img src="${foto}" onclick="ampliar('${p.id}')" class="cursor-pointer object-contain h-full w-full">
                ${!hayStock ? '<span class="absolute bg-black/70 text-white px-2 py-1 rounded text-[10px] font-bold">AGOTADO</span>' : ""}
              </div>
              <p class="text-[9px] font-mono text-gray-400">${p.id}</p>
              <h3 class="font-bold text-gray-800 text-xs h-8 line-clamp-2 mb-1">${p.nombre}</h3>
              <p class="text-pueblo font-black text-lg">$${precioARS(p.precio)}</p>
              ${
                hayStock
                  ? `
                <div class="flex items-center justify-between mt-2 bg-gray-50 rounded-lg p-1 border">
                   <button onclick="cambiarCantCarta('${p.id}', -1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-pueblo font-bold">-</button>
                   <span id="cant-${p.id}" class="font-bold text-xs">${yaEsta ? yaEsta.cantidad : 1}</span>
                   <button onclick="cambiarCantCarta('${p.id}', 1)" class="w-6 h-6 flex items-center justify-center bg-white rounded shadow-sm text-pueblo font-bold">+</button>
                </div>
                <button id="btn-add-${p.id}" onclick="agregarAlCarrito('${p.id}')" class="w-full mt-2 ${yaEsta ? "btn-ya-agregado" : "bg-pueblo"} text-white py-2 rounded-xl font-bold text-[10px] uppercase transition-all">
                  ${yaEsta ? "AGREGADO ✓" : "AGREGAR"}
                </button>
              `
                  : ""
              }
            </div>`;
          })
          .join("");
      }

      function ampliar(id) {
        const p = productos.find((x) => x.id === id);
        if (!p) return;
        document.getElementById("foto-ampliada").src =
          p.foto || `fotos/${p.id}.webp`;
        document.getElementById("id-ampliado").innerText = p.id;
        document.getElementById("titulo-ampliado").innerText = p.nombre;
        document.getElementById("desc-ampliada").innerText =
          p.descripcion || p.desc || "Sin descripción disponible.";
        document.getElementById("precio-ampliado").innerText =
          "$" + precioARS(p.precio);

        const btn = document.getElementById("btn-modal-agregar");
        btn.onclick = () => {
          agregarAlCarrito(p.id);
          cerrarModal();
        };

        const modal = document.getElementById("modal-foto");
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      function cerrarModal() {
        document.getElementById("modal-foto").classList.add("hidden");
      }

      function agregarAlCarrito(id) {
        const prod = productos.find((p) => p.id === id);
        const cant = parseInt(document.getElementById(`cant-${id}`).innerText);
        const existe = carrito.find((i) => i.id === id);

        if (existe) existe.cantidad = cant;
        else carrito.push({ ...prod, cantidad: cant });

        actualizarCarrito();
      }

      function actualizarCarrito() {
        const cont = document.getElementById("items-carrito");
        let html = "";
        let total = 0;

        carrito.forEach((item) => {
          total += item.precio * item.cantidad;
          html += `
            <div class="flex justify-between items-center border-b pb-2 text-[11px]">
              <div class="flex-1 font-bold truncate pr-2">${item.nombre}</div>
              <div class="flex items-center gap-2">
                <span class="font-bold">${item.cantidad}u</span>
                <button onclick="eliminar('${item.id}')" class="text-red-500 font-bold">✕</button>
              </div>
            </div>`;
        });

        cont.innerHTML = carrito.length
          ? html
          : '<p class="text-center text-gray-400 py-4 italic">Vacío</p>';
        document.getElementById("total-pedido").innerText =
          "$" + precioARS(total);
        localStorage.setItem("carrito_pueblo", JSON.stringify(carrito));
        aplicarFiltros();
      }

      function cambiarCantCarta(id, c) {
        const el = document.getElementById(`cant-${id}`);
        let n = parseInt(el.innerText) + c;
        if (n >= 1) el.innerText = n;
      }

      function eliminar(id) {
        carrito = carrito.filter((i) => i.id !== id);
        actualizarCarrito();
      }

      function aplicarFiltros() {
        let f = [...productos];
        const busqueda = document
          .getElementById("buscador")
          .value.toUpperCase();
        if (categoriaActual !== "TODOS") {
          if (categoriaActual === "SALE") f = f.filter((p) => p.oferta);
          else f = f.filter((p) => p.cat === categoriaActual);
        }
        if (busqueda)
          f = f.filter(
            (p) =>
              p.nombre.toUpperCase().includes(busqueda) ||
              p.id.toUpperCase().includes(busqueda),
          );

        const orden = document.getElementById("ordenar").value;
        if (orden === "menor") f.sort((a, b) => a.precio - b.precio);
        if (orden === "mayor") f.sort((a, b) => b.precio - a.precio);

        mostrarProductos(f);
      }

      function filtrar(cat, btn) {
        categoriaActual = cat;
        document
          .querySelectorAll(".categoria-btn")
          .forEach((b) => b.classList.replace("bg-pueblo", "bg-white"));
        btn.classList.replace("bg-white", "bg-pueblo");
        aplicarFiltros();
      }

      function buscar() {
        aplicarFiltros();
      }

      function enviarWhatsApp() {
        if (!carrito.length) return;
        let msg = "Hola Tienda Pueblo, mi pedido:\n\n";
        carrito.forEach((i) => (msg += `• ${i.nombre} (x${i.cantidad})\n`));
        msg += `\nTotal: ${document.getElementById("total-pedido").innerText}`;
        window.open(
          `https://wa.me/543413261010?text=${encodeURIComponent(msg)}`,
        );
      }

      window.onload = () => {
        setTimeout(() => {
          if (typeof productos !== "undefined") aplicarFiltros();
        }, 500);
        actualizarCarrito();
      };
    </script>
  </body>
</html>
